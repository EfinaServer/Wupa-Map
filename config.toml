# Pterodactyl server identifier (from panel URL or API)
server_id = "b199d5ae"

# Server type: "vanilla", "plugin" or "unified"
# - vanilla: dimensions are subdirectories (world/DIM-1, world/DIM1)
# - plugin:  dimensions are separate folders (world, world_nether, world_the_end)
# - unified:  dimensions are inside dimensions folders (world/dimensions/minecraft/overworld)
server_type = "unified"

# Base world folder name (e.g. "world", "survival", etc.)
world_name = "world"

# Minecarft Render version
mc_version = "26.1.2"

# BlueMap CLI version to download and use for rendering
bluemap_version = "5.20"
