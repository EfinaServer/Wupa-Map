name: BlueMap - Render WupaServer

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 19 * * 6" # UTC / UTC+8 每周六的 3:00 
  push:
    branches:
      - main
    paths:
      - Wupa

jobs:
  build:
    uses: EfinaServer/bluemap-action/.github/workflows/build-map.yml@main
    with:
      server-directory: Wupa
      netlify-site-id: f2ac50f8-0315-4deb-ba4d-2ad173cf8097
    secrets:
      PTERODACTYL_PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
      PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
